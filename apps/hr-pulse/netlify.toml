# Netlify build config for the HR Pulse app itself (distinct from the repo-root netlify.toml,
# which only builds the design-system Storybook — see README.md "Netlify builds Storybook from
# protected main and branch previews from working branches").
#
# To use this file: in the Netlify Dashboard, create a NEW site (separate from the Storybook
# site) pointing at this same GitHub repo, then set:
#   Site configuration → Build & deploy → Continuous deployment → Build settings
#     Base directory: apps/hr-pulse
# Netlify will then read this file (relative to that base directory) for the build command.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Free password protection (Edge Function Basic Auth) — see netlify/edge-functions/basic-auth.ts.
# Set env var HR_PULSE_BASIC_AUTH = "user:password" (space-separated for multiple pairs) in this
# site's Netlify dashboard → Site configuration → Environment variables. Unset or malformed =
# fail-closed 503 (site locked), never a silent public pass-through.
[[edge_functions]]
  path = "/*"
  function = "basic-auth"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
